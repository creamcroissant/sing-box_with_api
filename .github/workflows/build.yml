name: Build Sing-box

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sing-box version tag (e.g., v1.10.0). Leave empty for latest.'
        required: false
  schedule:
    - cron: '0 0 * * *' # Daily check

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get upstream latest release
          UPSTREAM_LATEST=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          echo "Upstream latest: $UPSTREAM_LATEST"

          # Get local latest release
          LOCAL_LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name || echo "none")
          echo "Local latest: $LOCAL_LATEST"

          # Determine target version
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
            FORCE_BUILD="true"
          else
            TARGET_TAG="$UPSTREAM_LATEST"
            if [ "$UPSTREAM_LATEST" == "$LOCAL_LATEST" ]; then
              echo "Already up to date."
              echo "build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            FORCE_BUILD="false"
          fi

          echo "Target tag: $TARGET_TAG"
          echo "build=true" >> $GITHUB_OUTPUT
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Setup Go
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout Upstream
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.check.outputs.target_tag }}
          path: sing-box-src

      - name: Build AMD64
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          GOOS=linux GOARCH=amd64 go build -v -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_v2ray_api" -o ../sing-box-linux-amd64 ./cmd/sing-box

      - name: Build ARM64
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          GOOS=linux GOARCH=arm64 go build -v -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_v2ray_api" -o ../sing-box-linux-arm64 ./cmd/sing-box

      - name: Create Release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.check.outputs.target_tag }} \
            sing-box-linux-amd64 \
            sing-box-linux-arm64 \
            --title "Sing-box ${{ steps.check.outputs.target_tag }} (Custom Build)" \
            --notes "Custom build with v2ray_api enabled. Upstream: SagerNet/sing-box@${{ steps.check.outputs.target_tag }}"
