name: Build Sing-box

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sing-box version tag (e.g., v1.10.0). Leave empty for latest.'
        required: false
  schedule:
    - cron: '0 0 * * *'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine target version
        id: check
        run: |
          # Only use GITHUB_REF_NAME for tag push events
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$GITHUB_REF_NAME" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "target_tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "source=tag" >> $GITHUB_OUTPUT
            exit 0
          fi

          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "target_tag=$INPUT_TAG" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled: find newest upstream release not yet built locally
          UPSTREAM_LATEST=$(gh api repos/SagerNet/sing-box/releases --jq '[.[] | select(.prerelease == false) | .tag_name][0]')
          echo "Upstream latest: $UPSTREAM_LATEST"

          # Collect all locally existing tags
          gh api repos/${{ github.repository }}/releases --jq '.[].tag_name' > /tmp/local_tags.txt
          echo "Local tags ($(wc -l < /tmp/local_tags.txt)):"
          cat /tmp/local_tags.txt

          # Check if upstream latest already exists locally
          if grep -Fxq "$UPSTREAM_LATEST" /tmp/local_tags.txt; then
            echo "Already built upstream $UPSTREAM_LATEST."
            echo "build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "build=true" >> $GITHUB_OUTPUT
          echo "target_tag=$UPSTREAM_LATEST" >> $GITHUB_OUTPUT
          echo "source=schedule" >> $GITHUB_OUTPUT

      - name: Setup Go
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-go@v5
        with:
          # 固定 1.24.x：go1.27 移除 std encoding/json 的 SkipFunc/DiscardUnknownMembers，
          # 使 go-json-experiment 旧版 alias.go 编译失败(Build AMD64 自 2026-08-25 起挂)。
          go-version: '1.24.7'

      - name: Checkout Upstream
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.check.outputs.target_tag }}
          path: sing-box-src
          persist-credentials: false
          fetch-depth: 1

      - name: Apply User Service Patch
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          git config user.email "ci@mgpanel.local"
          git config user.name "mgpanel CI"
          git apply --verbose "../patches/user-service.patch"
          echo "User Service patch applied OK"

      - name: Pre-download modules
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          go mod download
          echo "All modules downloaded OK"

      - name: Patch tailscale for Go 1.24+ compatibility
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          python3 ../patches/fix-tailscale-mod.py

      - name: Verify build (AMD64)
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          GOOS=linux GOARCH=amd64 go build -v -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_v2ray_api" -o ../sing-box-linux-amd64 ./cmd/sing-box
          echo "AMD64 build OK"

      - name: Build ARM64
        if: steps.check.outputs.build == 'true'
        run: |
          cd sing-box-src
          GOOS=linux GOARCH=arm64 go build -v -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_v2ray_api" -o ../sing-box-linux-arm64 ./cmd/sing-box
          echo "ARM64 build OK"

      - name: Create Release
        if: steps.check.outputs.build == 'true'
        env:
          PRERELEASE: ${{ contains(steps.check.outputs.target_tag, 'alpha') || contains(steps.check.outputs.target_tag, 'beta') || contains(steps.check.outputs.target_tag, 'rc') }}
        run: |
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          TAG="${{ steps.check.outputs.target_tag }}"
          # 幂等：release 已存在则复用并覆盖 assets（手动重跑同 tag 不冲突）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets (clobber)"
            gh release upload "$TAG" sing-box-linux-amd64 sing-box-linux-arm64 --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              sing-box-linux-amd64 sing-box-linux-arm64 \
              $PRERELEASE_FLAG \
              --title "Sing-box $TAG (Custom Build)" \
              --notes "Custom build with v2ray_api enabled + runtime user-management (HandlerService). Upstream: SagerNet/sing-box@$TAG"
          fi

      - name: Cleanup old releases
        run: |
          KEEP_RELEASE=3
          KEEP_ALPHA=7

          gh api repos/${{ github.repository }}/releases --jq '.[] | "\(.tag_name) \(.prerelease)"' > /tmp/all.txt

          grep ' false$' /tmp/all.txt | awk '{print $1}' > /tmp/stable.txt
          STABLE_COUNT=$(wc -l < /tmp/stable.txt)
          if [ "$STABLE_COUNT" -gt "$KEEP_RELEASE" ]; then
            tail -n +$((KEEP_RELEASE + 1)) /tmp/stable.txt | while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "Deleting old stable: $t"
              gh release delete "$t" --repo ${{ github.repository }} --yes 2>&1 || true
            done
          fi

          grep ' true$' /tmp/all.txt | awk '{print $1}' > /tmp/alpha.txt
          ALPHA_COUNT=$(wc -l < /tmp/alpha.txt)
          if [ "$ALPHA_COUNT" -gt "$KEEP_ALPHA" ]; then
            tail -n +$((KEEP_ALPHA + 1)) /tmp/alpha.txt | while IFS= read -r t; do
              [ -z "$t" ] && continue
              echo "Deleting old alpha: $t"
              gh release delete "$t" --repo ${{ github.repository }} --yes 2>&1 || true
            done
          fi

          echo "Cleanup: stable $STABLE_COUNT->$KEEP_RELEASE, alpha $ALPHA_COUNT->$KEEP_ALPHA"
